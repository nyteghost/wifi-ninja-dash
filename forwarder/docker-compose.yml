services:
  ninja-forwarder:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Your UniFi Network container on Unraid (port 8443, self-signed cert is fine):
      UNIFI_URL: https://192.168.1.10:8443      # <-- your Unraid server's IP
      # Legacy controller login (create a local admin in UniFi -> Admins & Users):
      UNIFI_USER: ninja-dash                     # <-- the local admin username
      UNIFI_PASS: paste-the-password             # <-- its password
      # If you ever move to a UniFi console with API keys, use this instead:
      # UNIFI_API_KEY: paste-your-unifi-key
      ACCESS_TOKEN: pick-a-long-secret           # type this into the app's API key field
      # The forwarder also serves the dashboard itself at http://<unraid-ip>:8787
      # (home network only). Allow both that origin and GitHub Pages:
      ALLOWED_ORIGINS: https://nyteghost.github.io
