name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build
      - name: Locate static output
        run: |
          for d in dist/client .output/public dist; do
            if [ -d "$d" ]; then OUT="$d"; break; fi
          done
          echo "Using $OUT"
          [ -f "$OUT/index.html" ] || [ ! -f "$OUT/_shell.html" ] || cp "$OUT/_shell.html" "$OUT/index.html"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
